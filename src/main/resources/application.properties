spring.config.import=optional:file:./application-local.properties,optional:classpath:application-local.properties
spring.application.name=etechbackend

# Database Configuration (Environment variables with local fallback)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/etech_online_store?autoReconnect=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.
jwt.expiration=86400000

# ETech Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:eteccomputers38@gmail.com}
# For Gmail SMTP, a Google App Password should be set in environment variable or below
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Application Mail Settings
app.mail.from=eteccomputers38@gmail.com
app.mail.from-name=ETech Computers Support

spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.debug=false