spring.config.import=optional:file:./application-local.properties,optional:classpath:application-local.properties
spring.application.name=etechbackend

# Server Configuration (Render dynamically injects PORT environment variable)
server.port=${PORT:8080}

# Database connection using placeholders
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / ORM settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true


# ETech Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:eteccomputers38@gmail.com}
# For Gmail SMTP, a Google App Password should be set in environment variable or below
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Application Mail Settings
app.mail.from=eteccomputers38@gmail.com
app.mail.from-name=ETech Computers Support

spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.debug=false

# JWT Configuration
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}


# Google Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL}
gemini.api.url=${GEMINI_API_URL}

groq.api.key=${GROQ_API_KEY}
groq.model=${GROQ_MODEL}
groq.api.url=${GROQ_API_URL}


